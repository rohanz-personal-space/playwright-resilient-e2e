name: POM Contract Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pom-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate POM contract
        run: npm run pom:contract

      - name: Type check
        run: npm run typecheck
